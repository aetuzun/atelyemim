<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proje Arşivi · Atelye Mim Mimarlık</title>
<link rel="stylesheet" href="style.css">
<script src="sample.js" defer></script>
<script src="archive.js" defer></script>
</head>
<body>
<header class="masthead"><a href="https://www.atelyemimmimarlik.com/">Atelye Mim <span>Mimarlık</span></a><span>Adana, Türkiye</span></header>
<main>
<h1>Proje Arşivi</h1>
<section class="archive" aria-label="Projeler">
<div class="controls">
<label>Proje ara<input id="search" type="search" placeholder="Proje adı, konum veya kod"></label>
<label>Tipoloji<select id="type"><option value="">Tümü</option></select></label>
<label>Konum<select id="city"><option value="">Tümü</option></select></label>
<label>Sıralama<select id="order"><option value="desc">Yeniden eskiye</option><option value="asc">Eskiden yeniye</option><option value="name">Proje adına göre</option></select></label>
</div>
<div class="viewbar"><p id="count" aria-live="polite"></p><div role="group" aria-label="Görünüm"><button id="list" aria-pressed="true">Liste</button><button id="gallery" aria-pressed="false">Görseller</button></div></div>
<div id="results"></div>
<noscript>Proje arşivini görüntülemek için JavaScript’i etkinleştirin.</noscript>
</section>
</main>
<footer><span>Atelye Mim Mimarlık</span><span>Proje Arşivi</span></footer>
</body>
</html>
