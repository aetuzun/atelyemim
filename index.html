<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proje Arşivi · Atelye Mim Mimarlık</title>
<link rel="stylesheet" href="style.css">
<script src="sample.js" defer></script>
<script src="archive.js" defer></script>
</head>
<body>
<header class="masthead">
  <a class="brand" href="./">Atelye Mim Mimarlık</a>
  <div class="view-switch" role="group" aria-label="Görünüm">
    <button id="list" aria-pressed="true">Liste</button>
    <button id="gallery" aria-pressed="false">Görseller</button>
  </div>
</header>
<main>
<h1>Proje Arşivi</h1>
<section class="archive" aria-label="Projeler">
<div class="controls">
  <label>Tipoloji<select id="type"><option value="">Tümü</option></select></label>
  <label>Konum<select id="city"><option value="">Tümü</option></select></label>
  <label class="search">Proje ara<input id="search" type="search" placeholder="Ad, konum veya kod"></label>
</div>
<p id="count" aria-live="polite"></p>
<div id="results"></div>
<noscript>Proje arşivini görüntülemek için JavaScript’i etkinleştirin.</noscript>
</section>
</main>
<dialog id="project-dialog" aria-labelledby="project-heading">
  <form method="dialog"><button>Kapat</button></form>
  <div id="project-details"></div>
</dialog>
</body>
</html>
